[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myid-anki"
version = "0.1.0"
description = "Build an Indonesian–Malaysian vocabulary Anki deck from reviewed source data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["genanki>=0.13.1,<0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
myid-anki = "indo_malay_anki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
junit_family = "legacy"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
