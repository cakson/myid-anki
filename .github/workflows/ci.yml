name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Validate and build deck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out revision
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate vocabulary and media
        run: python -m indo_malay_anki validate

      - name: Run tests
        run: pytest

      - name: Check Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Build deck
        run: python -m indo_malay_anki build

      - name: Require built deck
        run: test -s dist/myid-anki.apkg

      - name: Upload CI deck artifact
        uses: actions/upload-artifact@v7
        with:
          name: indonesian-malaysian-ci-apkg
          path: dist/missing.apkg
          if-no-files-found: error
